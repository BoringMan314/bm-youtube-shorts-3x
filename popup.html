<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="popupTitle"></title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="header-icon" src="icons/icon.png" width="40" height="40" alt="" />
      <div class="header-copy">
        <h1 data-i18n="popupTitle"></h1>
        <p data-i18n="extDescription"></p>
      </div>
    </header>
    <main>
      <section class="settings-section" aria-labelledby="playbackHeading">
        <h2 class="section-title" id="playbackHeading" data-i18n="popupPlaybackGroup"></h2>
        <div class="cards">
          <div class="card setting-card">
            <span class="card-title" data-i18n="popupDefaultShortSpeedLabel"></span>
            <button type="button" id="btnDefaultSpeed" class="footer-link">
              <span id="lblDefaultSpeed">1×</span>
              <span class="button-hint" aria-hidden="true">↻</span>
            </button>
          </div>
          <div class="card setting-card">
            <span class="card-title" data-i18n="popupDefaultHoldSpeedLabel"></span>
            <button type="button" id="btnHoldSpeed" class="footer-link">
              <span id="lblHoldSpeed">2×</span>
              <span class="button-hint" aria-hidden="true">↻</span>
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
